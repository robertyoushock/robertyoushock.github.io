<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D8D9DA" />
      <stop offset="100%" stop-color="#999A9B" />
    </linearGradient>
  </defs>
  <!-- Can body -->
  <rect x="6" y="4" width="20" height="24" rx="4" fill="url(#silverGrad)" stroke="#0A0A0A" stroke-width="1.5" />
  <!-- Pull tab oval -->
  <ellipse cx="16" cy="7" rx="5" ry="2" fill="#B0B2B4" stroke="#0A0A0A" stroke-width="1" />
  <circle cx="16" cy="7" r="1" fill="#0A0A0A" />
  <!-- Crimson Diet Coke stripe -->
  <rect x="6" y="12" width="20" height="7" fill="#E31837" />
  <!-- DC logo text approximation -->
  <text x="16" y="17.5" font-family="Arial, sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DC</text>
  <!-- Condensation dot -->
  <circle cx="21" cy="23" r="1" fill="#FFFFFF" opacity="0.8" />
</svg>
